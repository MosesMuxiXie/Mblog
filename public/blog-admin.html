<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-2T9L9PF3P5"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-2T9L9PF3P5');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>管理员登录 | Mosankai Blog</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/blog-admin.css">
</head>
<body class="admin-login-page">
  <main class="login-shell">
    <section class="login-visual" aria-label="Mosankai Blog">
      <a class="brand brand-light" href="/blog">
        <span class="brand-mark">M</span>
        <span>MOSANKAI / BLOG</span>
      </a>
      <div class="visual-copy">
        <span class="eyebrow">PRIVATE EDITORIAL ACCESS</span>
        <h1>把想法整理好，<br>再让它被看见。</h1>
        <p>仅限博客管理员进入。所有发布和编辑操作都会在登录会话中完成。</p>
      </div>
      <span class="visual-index">01 — ADMIN</span>
    </section>

    <section class="login-panel">
      <div class="login-card">
        <a class="back-link" href="/blog" aria-label="返回博客">← 返回博客</a>
        <div class="login-heading">
          <span class="eyebrow ink">SECURE SIGN IN</span>
          <h2>管理员登录</h2>
          <p>输入唯一管理员账号，进入内容后台。</p>
        </div>

        <form id="login-form" class="stack-form">
          <label>
            <span>管理员账号</span>
            <input id="username" name="username" type="text" autocomplete="username"
              autocapitalize="none" spellcheck="false" required maxlength="40" autofocus>
          </label>
          <label>
            <span>密码</span>
            <div class="password-field">
              <input id="password" name="password" type="password"
                autocomplete="current-password" required maxlength="128">
              <button class="text-button" id="toggle-password" type="button"
                aria-label="显示密码">显示</button>
            </div>
          </label>
          <div id="login-message" class="form-message" role="alert" aria-live="polite"></div>
          <button class="primary-button" type="submit">
            进入博客后台
            <span aria-hidden="true">↗</span>
          </button>
        </form>

        <aside class="first-login-note">
          <span class="note-dot"></span>
          <p><strong>首次登录</strong><br>初始账号为 Admin，初始密码为 123456。登录后请立即修改。</p>
        </aside>
      </div>
    </section>
  </main>
  <script src="/blog-admin.js" defer></script>
</body>
</html>
