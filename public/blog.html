<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-2T9L9PF3P5"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-2T9L9PF3P5');
  </script>
  <meta charset="UTF-8">
  <title data-i18n="blog.title">Blog | Mosankai</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/blog.css">
  <link rel="stylesheet" href="/i18n.css">
  <script src="/i18n.js"></script>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <div class="hero" style="background-image:url('/img/m48a5_patton_cn.jpg')">
        <h1>tanks</h1>
        <p>
          <span data-i18n="blog.explore">Explore.</span><br>
          <span data-i18n="blog.shoot">Shoot.</span><br>
          <span data-i18n="blog.write">Write.</span>
        </p>
        <div class="author">
          <span data-i18n="blog.authorLine">A tank lover's personal blog</span><br>
          <span data-i18n="blog.byAuthor">By Moses Xie</span>
        </div>
        <div style="margin-top:2em;font-size:1.3em;">
          <a href="#" style="color:#fff;margin-right:0.5em;"><span title="Twitter" data-i18n-title="blog.twitter">🐦</span></a>
          <a href="#" style="color:#fff;margin-right:0.5em;"><span title="Facebook" data-i18n-title="blog.facebook">📘</span></a>
          <a href="#" style="color:#fff;"><span title="Subscribe" data-i18n-title="blog.subscribeIcon">🔔</span></a>
        </div>
      </div>
    </div>
    <div class="main">
      <nav aria-label="Blog navigation" data-i18n-aria-label="blog.navigation">
        <a href="/" data-i18n="blog.home">HOME</a>
        <a href="#" class="active" onclick="showList();return false;" data-i18n="blog.articles">ARTICLES</a>
        <a href="#" onclick="alert(MosankaiI18n.t('blog.suggestComingSoon'));return false;" data-i18n="blog.suggest">SUGGEST</a>
        <a href="#" onclick="alert(MosankaiI18n.t('blog.subscribeComingSoon'));return false;" data-i18n="blog.subscribe">SUBSCRIBE</a>
        <a href="#" onclick="alert(MosankaiI18n.t('blog.aboutComingSoon'));return false;" data-i18n="blog.about">ABOUT</a>
        <a href="/findatime" data-i18n="blog.findatime">FIND A TIME</a>
        <a href="/blog/admin" style="margin-left:auto;" data-i18n="blog.admin">ADMIN</a>
      </nav>
      <div id="blog-list" class="blog-list"></div>
      <div id="blog-detail" style="display:none;max-width:700px;margin:2.2em auto;"></div>
    </div>
  </div>
  <script>
    let blogs = [];
    let currentBlog = null;
    const t = (key, parameters) => MosankaiI18n.t(key, parameters);

    function escapeHtml(value) {
      const node = document.createElement('span');
      node.textContent = value == null ? '' : String(value);
      return node.innerHTML;
    }

    function safeImage(value) {
      const candidate = String(value || '').trim();
      if (!candidate || candidate === '/img/default.jpg') return '';
      if (/^data:image\/(?:png|jpe?g|gif|webp);base64,[a-z0-9+/=]+$/i.test(candidate)) {
        return candidate;
      }
      if (candidate.startsWith('/') && !candidate.startsWith('//')) return candidate;
      try {
        const parsed = new URL(candidate);
        return ['http:', 'https:'].includes(parsed.protocol) ? parsed.href : '';
      } catch {
        return '';
      }
    }

    function formatBlogDate(value) {
      const date = new Date(`${value}T00:00:00`);
      return Number.isNaN(date.getTime())
        ? escapeHtml(value)
        : new Intl.DateTimeFormat(MosankaiI18n.locale(), {
            year: 'numeric',
            month: 'short',
            day: 'numeric'
          }).format(date);
    }

    async function fetchBlogs() {
      const response = await fetch('/api/blogs');
      if (!response.ok) throw new Error('Unable to load articles.');
      blogs = await response.json();
    }

    function renderBlogList() {
      const list = blogs.map(blog => {
        const image = safeImage(blog.image);
        return `
        <article class="blog-item${image ? '' : ' no-image'}" data-blog-id="${encodeURIComponent(blog.slug || blog.id)}" tabindex="0">
          ${image ? `<img src="${escapeHtml(image)}" class="blog-thumb" alt="${escapeHtml(t('blog.imageAlt'))}">` : ''}
          <div class="blog-meta">
            <div class="blog-title">${escapeHtml(blog.title)}</div>
            <div class="blog-excerpt">${escapeHtml(blog.excerpt || '')}</div>
            <div class="blog-info">
              ${formatBlogDate(blog.date)} &nbsp;|&nbsp; ${escapeHtml(blog.author || t('blog.anonymous'))}
            </div>
            <div class="blog-tags">
              ${(blog.tags || []).map(tag => `<span class="blog-tag">${escapeHtml(tag)}</span>`).join(' ')}
            </div>
          </div>
          <span class="blog-arrow">&rsaquo;</span>
        </article>`;
      }).join('');
      document.getElementById('blog-list').innerHTML = list || `<p>${escapeHtml(t('blog.noPosts'))}</p>`;
      document.getElementById('blog-list').style.display = '';
      document.getElementById('blog-detail').style.display = 'none';
    }

    function renderBlogDetail(blog, updateHistory = false) {
      currentBlog = blog;
      const content = blog.contentFormat === 'html' && blog.contentHtml
        ? blog.contentHtml
        : escapeHtml(blog.content);
      const image = safeImage(blog.image);
      document.getElementById('blog-detail').innerHTML = `
        <a href="#" id="back-to-articles" style="color:#1976d2;">&larr; ${escapeHtml(t('blog.backToArticles'))}</a>
        <h2 style="margin-top:0.7em;color:#1976d2;">${escapeHtml(blog.title)}</h2>
        <div style="margin-bottom:1em;font-size:1.05em;color:#888;">
          ${formatBlogDate(blog.date)} &nbsp;|&nbsp; ${escapeHtml(blog.author || t('blog.anonymous'))}
        </div>
        ${image ? `<img src="${escapeHtml(image)}" alt="${escapeHtml(t('blog.imageAlt'))}" class="blog-detail-image">` : ''}
        <div class="blog-content">${content}</div>
        <div style="margin-bottom:1.3em;">
          ${(blog.tags || []).map(tag => `<span class="blog-tag">${escapeHtml(tag)}</span>`).join(' ')}
        </div>
        <div style="margin:2em 0 1em 0;">
          <h3 style="color:#1976d2;margin-bottom:0.5em;">${escapeHtml(t('blog.comments'))}</h3>
          <div id="comments">
            ${(blog.comments || []).map(comment => `
              <div style="border-bottom:1px solid #eee;padding:0.5em 0;">
                <b>${escapeHtml(comment.name)}</b> <span style="color:#888;font-size:0.92em;">(${formatBlogDate(comment.date)})</span><br>
                <div style="margin-top:0.2em;white-space:pre-wrap;">${escapeHtml(comment.text)}</div>
              </div>
            `).join('') || `<div style="color:#888;">${escapeHtml(t('blog.noComments'))}</div>`}
          </div>
          <form id="comment-form" style="margin-top:1em;">
            <input type="text" id="c-name" placeholder="${escapeHtml(t('blog.yourName'))}" required style="width:45%;padding:0.6em;margin-right:1em;">
            <textarea id="c-text" placeholder="${escapeHtml(t('blog.yourComment'))}" required style="width:98%;min-height:66px;padding:0.7em;margin:0.45em 0;"></textarea>
            <button type="submit" style="background:#1976d2;color:#fff;padding:0.6em 1.7em;border:none;border-radius:7px;font-size:1em;">${escapeHtml(t('blog.postComment'))}</button>
          </form>
        </div>
      `;
      document.getElementById('blog-list').style.display = 'none';
      document.getElementById('blog-detail').style.display = '';
      if (updateHistory) {
        history.pushState(
          { view: 'detail', slug: blog.slug || blog.id },
          '',
          `/blog/${encodeURIComponent(blog.slug || blog.id)}`
        );
      }
      document.getElementById('back-to-articles').addEventListener('click', event => {
        event.preventDefault();
        showList();
      });
      document.getElementById('comment-form').addEventListener('submit', async event => {
        event.preventDefault();
        const name = document.getElementById('c-name').value.trim();
        const text = document.getElementById('c-text').value.trim();
        if (!name || !text) return;
        const response = await fetch(`/api/blogs/${encodeURIComponent(blog.id)}/comments`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, text })
        });
        if (!response.ok) {
          const result = await response.json().catch(() => ({}));
          alert(result.error || 'Unable to post this comment.');
          return;
        }
        showBlog(blog.slug || blog.id, false);
      });
    }

    async function showList(updateHistory = true) {
      await fetchBlogs();
      currentBlog = null;
      renderBlogList();
      if (updateHistory && window.location.pathname !== '/blog') {
        history.pushState({ view: 'list' }, '', '/blog');
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function showBlog(identifier, updateHistory = true) {
      const response = await fetch(`/api/blogs/${encodeURIComponent(identifier)}`);
      if (!response.ok) throw new Error('Unable to load this article.');
      const blog = await response.json();
      renderBlogDetail(blog, updateHistory);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('blog-list').addEventListener('click', event => {
      const item = event.target.closest('[data-blog-id]');
      if (item) showBlog(decodeURIComponent(item.dataset.blogId));
    });
    document.getElementById('blog-list').addEventListener('keydown', event => {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      const item = event.target.closest('[data-blog-id]');
      if (item) {
        event.preventDefault();
        showBlog(decodeURIComponent(item.dataset.blogId));
      }
    });
    window.addEventListener('mosankai:languagechange', () => {
      if (currentBlog) renderBlogDetail(currentBlog, false);
      else renderBlogList();
    });
    window.addEventListener('popstate', () => {
      const slug = decodeURIComponent(window.location.pathname.replace(/^\/blog\/?/, ''));
      if (slug) showBlog(slug, false);
      else showList(false);
    });

    window.showBlog = showBlog;
    window.showList = showList;
    const initialSlug = decodeURIComponent(window.location.pathname.replace(/^\/blog\/?/, ''));
    const initialView = initialSlug ? showBlog(initialSlug, false) : showList(false);
    initialView.catch(error => {
      document.getElementById('blog-list').innerHTML = `<p>${escapeHtml(error.message)}</p>`;
    });
  </script>
</body>
</html>
